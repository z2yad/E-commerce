<nav class="fixed left-4 top-0 h-screen flex flex-col items-center justify-center z-50 pointer-events-none">
  <div class="pointer-events-auto flex flex-col items-center gap-2 p-2.5 bg-white/5 backdrop-blur-3xl border border-white/10 rounded-[28px] shadow-2xl">

    <!-- Dashboard Brand -->
    <a routerLink="/admin/dashboard"
      routerLinkActive #dashLink="routerLinkActive"
      [class]="dashLink.isActive ? 'bg-amber-500/20 ring-1 ring-amber-500/40' : 'bg-white/5 hover:bg-white/10'"
      class="h-14 w-14 rounded-[22px] flex items-center justify-center transition-all active:scale-95 cursor-pointer">
      <svg class="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    </a>

    <div class="w-8 h-px bg-white/10 my-1"></div>

    <!-- Orders -->
    <a routerLink="/admin/orders"
      routerLinkActive #ordersLink="routerLinkActive"
      [class]="ordersLink.isActive ? 'bg-amber-500/25 text-amber-400 ring-1 ring-amber-500/30' : 'bg-amber-500/10 text-amber-500/70 hover:bg-amber-500/20 hover:text-amber-400'"
      class="h-14 w-14 rounded-[22px] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 cursor-pointer">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span class="text-[9px] font-bold uppercase tracking-wider leading-none">Orders</span>
    </a>

    <!-- Users -->
    <a routerLink="/admin/users"
      routerLinkActive #usersLink="routerLinkActive"
      [class]="usersLink.isActive ? 'bg-pink-500/25 text-pink-400 ring-1 ring-pink-500/30' : 'bg-pink-500/10 text-pink-500/70 hover:bg-pink-500/20 hover:text-pink-400'"
      class="h-14 w-14 rounded-[22px] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 cursor-pointer">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-[9px] font-bold uppercase tracking-wider leading-none">Users</span>
    </a>

    <!-- Products -->
    <a routerLink="/admin/products"
      routerLinkActive #productsLink="routerLinkActive"
      [class]="productsLink.isActive ? 'bg-purple-500/25 text-purple-400 ring-1 ring-purple-500/30' : 'bg-purple-500/10 text-purple-500/70 hover:bg-purple-500/20 hover:text-purple-400'"
      class="h-14 w-14 rounded-[22px] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 cursor-pointer">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
      </svg>
      <span class="text-[9px] font-bold uppercase tracking-wider leading-none">Products</span>
    </a>

    <div class="w-8 h-px bg-white/10 my-1"></div>

    <!-- Settings -->
    <a routerLink="/admin/settings"
      routerLinkActive #settingsLink="routerLinkActive"
      [class]="settingsLink.isActive ? 'bg-emerald-500/25 text-emerald-400 ring-1 ring-emerald-500/30' : 'bg-emerald-500/10 text-emerald-500/70 hover:bg-emerald-500/20 hover:text-emerald-400'"
      class="h-14 w-14 rounded-[22px] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 cursor-pointer">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span class="text-[9px] font-bold uppercase tracking-wider leading-none">Settings</span>
    </a>

    <div class="w-8 h-px bg-white/10 my-1"></div>

    <!-- Profile -->
    <a routerLink="/profile"
      class="h-14 w-14 rounded-[22px] bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 cursor-pointer">
      <div class="h-7 w-7 rounded-xl bg-gradient-to-br from-amber-500 to-pink-500 flex items-center justify-center text-white font-black text-xs shadow-lg">
        {{ currentUser()?.name?.charAt(0) || 'A' }}
      </div>
      <span class="text-[9px] font-bold uppercase tracking-wider leading-none">Profile</span>
    </a>

    <!-- Logout -->
    <button (click)="logout()"
      class="h-14 w-14 rounded-[22px] bg-red-500/10 text-red-400/70 hover:bg-red-500/20 hover:text-red-400 flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 cursor-pointer">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="text-[9px] font-bold uppercase tracking-wider leading-none">Logout</span>
    </button>

  </div>
</nav>
