<section class="hero-bg relative w-full h-[calc(100vh-64px)] flex items-center justify-center overflow-hidden">
    <!-- Dark overlay to ensure text is readable against the background -->
    <div class="absolute inset-0 bg-black/50 z-0"></div>

    <!-- Hero Content -->
    <div
        class="relative z-10 flex flex-col items-center text-center px-4 max-w-5xl mx-auto gap-6 animate-in fade-in zoom-in duration-700">

        <!-- Top badge -->
        <span
            class="px-4 py-1.5 rounded-full bg-white/10 border border-white/20 text-white text-sm font-medium backdrop-blur-md">
            ✨ 2026 Collection Available
        </span>

        <!-- Main Title -->
        <h1 class="text-5xl md:text-7xl font-extrabold text-white tracking-tight drop-shadow-md">
            Discover Premium <br class="hidden md:block" />
            <span class="text-primary drop-shadow-lg">Quality Products</span>
        </h1>

        <!-- Subtitle -->
        <p class="text-lg md:text-xl text-zinc-300 max-w-2xl drop-shadow">
            Shop the latest trends with ShopZiad. Elevate your everyday style and find exactly what you've been looking
            for.
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 mt-6 w-full sm:w-auto">
            <a routerLink="/products/productlist"
                class="inline-flex items-center justify-center px-8 py-4 bg-primary text-primary-foreground font-semibold rounded-xl hover:bg-primary/90 transition-all duration-300 shadow-[0_0_20px_rgba(var(--primary),0.3)] hover:shadow-[0_0_30px_rgba(var(--primary),0.5)] transform hover:-translate-y-1">
                Start Shopping
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ml-2" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <a routerLink="/about"
                class="inline-flex items-center justify-center px-8 py-4 bg-white/10 backdrop-blur-md text-white border border-white/20 font-semibold rounded-xl hover:bg-white/20 transition-all duration-300 transform hover:-translate-y-1">
                Explore Categories
            </a>
        </div>

    </div>
</section>
