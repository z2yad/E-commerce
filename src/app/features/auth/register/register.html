<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-[#0B1120] via-[#0F172A] to-[#0B1120]">
    <!-- Animated Background Accents -->
    <div class="absolute top-[20%] left-[10%] w-72 h-72 bg-amber-500/10 blur-[120px] rounded-full animate-pulse-slow"></div>
    <div class="absolute bottom-[20%] right-[10%] w-96 h-96 bg-pink-500/10 blur-[120px] rounded-full animate-pulse-slow-reverse"></div>

    <div class="relative z-10 w-full max-w-md bg-white/5 backdrop-blur-2xl border border-white/10 rounded-[32px] p-8 md:p-10 shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white mb-2 tracking-tight uppercase">Join the Elite</h2>
            <div class="h-1.5 w-16 bg-gradient-to-r from-amber-500 via-orange-500 to-pink-500 rounded-full mx-auto mb-4"></div>
            <p class="text-gray-400 text-sm font-medium tracking-wide">Create your luxury account today</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-5">
            <!-- Full Name -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">Full Name</label>
                <div class="relative group">
                    <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-amber-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>

            <!-- Email Field -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">Email Address</label>
                <div class="relative group">
                    <input type="email" [(ngModel)]="email" name="email" placeholder="name@example.com"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-amber-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                    </svg>
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">Password</label>
                <div class="relative group">
                    <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-pink-500/30 transition-all">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-pink-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error()" class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs py-3 px-4 rounded-xl animate-shake">
                {{ error() }}
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="isLoading()"
                class="w-full relative group overflow-hidden bg-gradient-to-r from-amber-500 via-orange-500 to-pink-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-amber-500/10 hover:shadow-amber-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 disabled:opacity-70 uppercase tracking-widest text-sm">
                <div class="relative z-10 flex items-center justify-center gap-2">
                    <span *ngIf="!isLoading()">Create Account</span>
                    <span *ngIf="isLoading()" class="flex items-center gap-2 font-medium">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Creating account...
                    </span>
                </div>
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm font-medium">
                Already member of the club? 
                <a routerLink="/login" class="text-amber-400 hover:text-amber-300 font-black transition-all uppercase tracking-tighter decoration-1 underline-offset-4 hover:underline">Sign In</a>
            </p>
        </div>
    </div>
</div>
