<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-[#0B1120] via-[#0F172A] to-[#0B1120]">
    <!-- Animated Background Accents -->
    <div class="absolute top-[20%] left-[10%] w-72 h-72 bg-amber-500/10 blur-[120px] rounded-full animate-pulse-slow"></div>
    <div class="absolute bottom-[20%] right-[10%] w-96 h-96 bg-pink-500/10 blur-[120px] rounded-full animate-pulse-slow-reverse"></div>

    <div class="relative z-10 w-full max-w-md bg-white/5 backdrop-blur-2xl border border-white/10 rounded-[32px] p-8 md:p-10 shadow-2xl">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-white mb-2 tracking-tight uppercase">Welcome Back</h2>
            <div class="h-1.5 w-16 bg-gradient-to-r from-amber-500 via-orange-500 to-pink-500 rounded-full mx-auto mb-4"></div>
            <p class="text-gray-400 text-sm font-medium tracking-wide">Experience the future of luxury shopping</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Email Field -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">Email Address</label>
                <div class="relative group">
                    <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" placeholder="name@example.com"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:bg-white/10 transition-all duration-300">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-amber-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                    </svg>
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Password</label>
                    <a class="text-[10px] text-amber-400 hover:text-amber-300 transition-colors cursor-pointer uppercase font-black tracking-tighter">Forgot?</a>
                </div>
                <div class="relative group">
                    <input [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="••••••••"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-12 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-pink-500/30 focus:bg-white/10 transition-all duration-300">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-pink-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <!-- Eye Icon Toggle -->
                    <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors focus:outline-none">
                        <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057-5.064-7-9.542-7-.39 0-.77.027-1.144.08M15 12a3 3 0 11-6 0 3 3 0 016 0zm-3.875-6.825L12 5z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error()" class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs py-3 px-4 rounded-xl animate-shake">
                {{ error() }}
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="isLoading()"
                class="w-full relative group overflow-hidden bg-gradient-to-r from-amber-500 via-orange-500 to-pink-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-amber-500/10 hover:shadow-amber-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed uppercase tracking-widest text-sm">
                <div class="relative z-10 flex items-center justify-center gap-2">
                    <span *ngIf="!isLoading()">Sign In</span>
                    <span *ngIf="isLoading()" class="flex items-center gap-2 font-medium">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Authenticating...
                    </span>
                </div>
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm font-medium">
                Don't have an account? 
                <a routerLink="/register" class="text-amber-400 hover:text-amber-300 font-black transition-all uppercase tracking-tighter decoration-1 underline-offset-4 hover:underline">Sign Up</a>
            </p>
        </div>
    </div>
</div>
