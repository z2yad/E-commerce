<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-6">
    @for (product of products(); track product.id) {

    <div class="group flex flex-col rounded-lg border border-border bg-card 
                shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden
                 object-cover flex-item-center justify-between p-4">

        <!-- Image -->
        <div class="overflow-hidden h-52 bg-muted">
            <img [src]="product.thumbnail" [alt]="product.title" class="w-full h-full
                 group-hover:scale-105 transition-transform duration-300">
        </div>

        <!-- Content -->
        <div class="flex flex-col flex-1 p-4 gap-3">

            <h3 class="text-sm font-semibold text-card-foreground line-clamp-1">
                {{ product.title }}
            </h3>

            <p class="text-xs text-muted-foreground line-clamp-2 flex-1">
                {{ product.description }}
            </p>

            <!-- Footer -->
            <div class="flex items-center justify-between pt-3 border-t border-border">

                <span class="text-base font-bold text-card-foreground">
                    ${{ product.price }}
                </span>

                <button aria-label="Add to cart" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium
                   bg-primary text-primary-foreground
                   hover:bg-primary/90
                   transition-colors duration-200 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 512 512">
                        <path fill="currentColor"
                            d="m397.78 316h-205.13a15 15 0 0 1 -14.65-11.67l-34.54-150.48a15 15 0 0 1 14.62-18.36h274.27a15 15 0 0 1 14.65 18.36l-34.6 150.48a15 15 0 0 1 -14.62 11.67zm-193.19-30h181.25l27.67-120.48h-236.6z" />
                        <path fill="currentColor"
                            d="m222 450a57.48 57.48 0 1 1 57.48-57.48 57.54 57.54 0 0 1 -57.48 57.48zm0-84.95a27.48 27.48 0 1 0 27.48 27.47 27.5 27.5 0 0 0 -27.48-27.47z" />
                        <path fill="currentColor"
                            d="m368.42 450a57.48 57.48 0 1 1 57.48-57.48 57.54 57.54 0 0 1 -57.48 57.48zm0-84.95a27.48 27.48 0 1 0 27.48 27.47 27.5 27.5 0 0 0 -27.48-27.47z" />
                        <path fill="currentColor"
                            d="m158.08 165.49a15 15 0 0 1 -14.23-10.26l-25.71-77.23h-47.44a15 15 0 1 1 0-30h58.3a15 15 0 0 1 14.23 10.26l29.13 87.49a15 15 0 0 1 -14.23 19.74z" />
                    </svg>
                    Add to cart
                </button>

            </div>
        </div>
    </div>

    }
