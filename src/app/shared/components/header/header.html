<!-- header.component.html -->
<header
  class="sticky top-0 z-50 w-full border-b border-white/10 bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 backdrop-blur-lg shadow-lg">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:px-8">

    <!-- LOGO with enhanced design -->
    <a routerLink="/" class="group flex items-center gap-2 font-bold text-lg tracking-tight text-white">
      <div
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-amber-500 to-pink-500 shadow-lg group-hover:shadow-xl group-hover:scale-110 transition-all duration-300">
        <svg class="h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
      </div>
      <span
        class="bg-gradient-to-r from-amber-400 to-pink-400 bg-clip-text text-transparent group-hover:from-amber-300 group-hover:to-pink-300 transition-all">
        E-Commerce
      </span>
    </a>

    <!-- SEARCH with enhanced styling -->
    <div class="hidden md:flex flex-1 max-w-sm mx-8">
      <div class="relative w-full group">
        <svg
          class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400 group-focus-within:text-amber-500 transition-colors duration-200"
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input type="text" placeholder="Search products..." class="w-full rounded-xl border border-gray-700 bg-gray-800/50 py-2.5 pl-9 pr-4 text-sm 
                      text-white placeholder:text-gray-400
                      focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-transparent
                      hover:border-gray-600 transition-all duration-200 backdrop-blur-sm" />

        <!-- Search shortcut hint (decorative) -->
        <div class="absolute right-3 top-1/2 -translate-y-1/2 hidden sm:flex items-center gap-1">
          <kbd
            class="px-1.5 py-0.5 text-xs font-semibold text-gray-400 bg-gray-700 rounded border border-gray-600">⌘</kbd>
          <kbd
            class="px-1.5 py-0.5 text-xs font-semibold text-gray-400 bg-gray-700 rounded border border-gray-600">K</kbd>
        </div>
      </div>
    </div>

    <!-- ACTIONS with enhanced design -->
    <div class="flex items-center gap-1">

      <!-- Search Mobile with enhanced styling -->
      <button class="md:hidden inline-flex h-9 w-9 items-center justify-center rounded-xl
                     text-gray-400 hover:bg-gray-800 hover:text-amber-500
                     transition-all duration-200 relative group">
        <svg class="h-5 w-5 group-hover:scale-110 transition-transform" xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <!-- Tooltip (decorative) -->
        <span
          class="absolute -bottom-8 left-1/2 -translate-x-1/2 text-[10px] bg-gray-800 text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
          Search
        </span>
      </button>

      <!-- Navigation with enhanced styling -->
      <nav class="hidden md:flex items-center gap-1">
        <a routerLink="/" routerLinkActive="bg-gradient-to-r from-amber-500 to-pink-500 text-white shadow-lg"
          [routerLinkActiveOptions]="{exact: true}" class="relative px-4 py-2 rounded-xl text-sm font-medium text-gray-300
                 hover:bg-gray-800 hover:text-white hover:shadow-md
                 transition-all duration-200 group overflow-hidden">
          <span class="relative z-10">Home</span>
          <!-- Animated background effect -->
          <span
            class="absolute inset-0 bg-gradient-to-r from-amber-500/0 to-pink-500/0 group-hover:from-amber-500/10 group-hover:to-pink-500/10 transition-all duration-300"></span>
        </a>

        <a routerLink="/products/productlist"
          routerLinkActive="bg-gradient-to-r from-amber-500 to-pink-500 text-white shadow-lg" class="relative px-4 py-2 rounded-xl text-sm font-medium text-gray-300
                  hover:bg-gray-800 hover:text-white hover:shadow-md
                  transition-all duration-200 group overflow-hidden">
          <span class="relative z-10">Products</span>
          <!-- Animated background effect -->
          <span
            class="absolute inset-0 bg-gradient-to-r from-amber-500/0 to-pink-500/0 group-hover:from-amber-500/10 group-hover:to-pink-500/10 transition-all duration-300"></span>
        </a>

        <!-- Categories dropdown (decorative) -->
        <div class="relative group">
          <button class="px-4 py-2 rounded-xl text-sm font-medium text-gray-300
                         hover:bg-gray-800 hover:text-white
                         
                         transition-all duration-200 inline-flex items-center gap-1">
            Categories
            <svg class="w-4 h-4 group-hover:rotate-180 transition-transform duration-300" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <!-- Dropdown menu (decorative - hidden by default) -->
          <div
            class="absolute top-full right-0 mt-2 w-48 bg-gray-800 rounded-xl shadow-2xl border border-gray-700 hidden group-hover:block">
            <div class="py-2">
              <a href="#"
                class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Electronics</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Fashion</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Home &
                Living</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Sports</a>
            </div>
          </div>
        </div>
      </nav>

      <!-- Cart with enhanced design -->
      <a routerLink="/cart" class="relative inline-flex h-9 w-9 items-center justify-center rounded-xl
               text-gray-400 hover:bg-gray-800 hover:text-amber-500
               transition-all duration-200 group">
        <svg class="h-5 w-5 group-hover:scale-110 transition-transform" xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512">
          <path fill="currentColor"
            d="m397.78 316h-205.13a15 15 0 0 1 -14.65-11.67l-34.54-150.48a15 15 0 0 1 14.62-18.36h274.27a15 15 0 0 1 14.65 18.36l-34.6 150.48a15 15 0 0 1 -14.62 11.67zm-193.19-30h181.25l27.67-120.48h-236.6z" />
          <path fill="currentColor"
            d="m222 450a57.48 57.48 0 1 1 57.48-57.48 57.54 57.54 0 0 1 -57.48 57.48zm0-84.95a27.48 27.48 0 1 0 27.48 27.47 27.5 27.5 0 0 0 -27.48-27.47z" />
          <path fill="currentColor"
            d="m368.42 450a57.48 57.48 0 1 1 57.48-57.48 57.54 57.54 0 0 1 -57.48 57.48zm0-84.95a27.48 27.48 0 1 0 27.48 27.47 27.5 27.5 0 0 0 -27.48-27.47z" />
          <path fill="currentColor"
            d="m158.08 165.49a15 15 0 0 1 -14.23-10.26l-25.71-77.23h-47.44a15 15 0 1 1 0-30h58.3a15 15 0 0 1 14.23 10.26l29.13 87.49a15 15 0 0 1 -14.23 19.74z" />
        </svg>

        <!-- Enhanced badge with animation -->
        <span class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center
                     rounded-full bg-gradient-to-r from-amber-500 to-pink-500 
                     text-white text-[10px] font-bold shadow-lg
                     group-hover:scale-110 transition-transform duration-200
                     animate-pulse">
          2
        </span>

        <!-- Tooltip (decorative) -->
        <span
          class="absolute -bottom-8 left-1/2 -translate-x-1/2 text-[10px] bg-gray-800 text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
          Cart
        </span>
      </a>

      <!-- Divider with enhanced styling -->
      <div class="mx-1 h-6 w-px bg-gradient-to-b from-transparent via-gray-600 to-transparent"></div>

      <!-- Profile with enhanced design -->
      <button class="relative inline-flex h-9 w-9 items-center justify-center rounded-xl
                     text-gray-400 hover:bg-gray-800 hover:text-amber-500
                     transition-all duration-200 group">
        <svg class="h-5 w-5 group-hover:scale-110 transition-transform" xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>

        <!-- Online status indicator (decorative) -->
        <span class="absolute bottom-0 right-0 h-2 w-2 rounded-full bg-green-500 border-2 border-gray-800"></span>

        <!-- Tooltip (decorative) -->
        <span
          class="absolute -bottom-8 left-1/2 -translate-x-1/2 text-[10px] bg-gray-800 text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
          Profile
        </span>
      </button>

      <!-- Theme toggle (decorative) -->
      <button class="hidden sm:inline-flex h-9 w-9 items-center justify-center rounded-xl
                     text-gray-400 hover:bg-gray-800 hover:text-amber-500
                     transition-all duration-200 group">
        <svg class="h-5 w-5 group-hover:rotate-45 transition-transform duration-500" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Progress bar (decorative) -->
  <div
    class="absolute bottom-0 left-0 h-0.5 bg-gradient-to-r from-amber-500 via-pink-500 to-amber-500 w-1/2 animate-pulse">
  </div>
</header>

<!-- Mobile search bar (appears below header on mobile) -->
<div class="md:hidden sticky top-16 z-40 w-full bg-gray-900/95 backdrop-blur-lg border-t border-gray-800 p-3">
  <div class="relative w-full">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    <input type="text" placeholder="Search products..." class="w-full rounded-xl border border-gray-700 bg-gray-800 py-2.5 pl-9 pr-4 text-sm 
                  text-white placeholder:text-gray-400
                  focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-transparent
                  transition-all duration-200" />
  </div>
</div>
